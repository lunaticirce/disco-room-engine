name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests examples tools
      - name: Audit curation
        run: python tools/curation.py audit curation
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Audit wheel boundary
        run: python tools/curation.py audit-wheel dist/*.whl
