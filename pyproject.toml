[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disco-room-engine"
version = "0.1.0"
description = "一个在本地运行、由数据驱动的叙事游戏引擎，承载带有大量条件分支的对话图与手工策展的房间菜单"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Chi"},
  {name = "Ash"},
  {name = "Lien"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[project.scripts]
disco-room = "disco_room.room:main"

[tool.setuptools.packages.find]
where = ["src"]
