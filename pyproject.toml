[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disco-room-engine"
version = "0.1.0"
description = "A local, data-driven runtime for Disco-style dialogue graphs and curated rooms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Chi"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[project.scripts]
disco-room = "disco_room.room:main"

[tool.setuptools.packages.find]
where = ["src"]
